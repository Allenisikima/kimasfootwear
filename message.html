<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>KimasFootwear | A Special Message</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at top left,
            rgba(212,175,55,.18),
            transparent 35%
        ),

        radial-gradient(
            circle at bottom right,
            rgba(255,105,180,.16),
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #050505,
            #120b10,
            #050505
        );

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 25px;

    overflow-x: hidden;
}


/* DECORATIVE HEARTS */

.heart {

    position: fixed;

    color: rgba(212,175,55,.18);

    font-size: 40px;

    pointer-events: none;

    animation:
        floatHeart 6s ease-in-out infinite;
}

.heart.one {

    top: 10%;

    left: 8%;
}

.heart.two {

    top: 70%;

    right: 8%;

    font-size: 55px;

    animation-delay: 2s;
}

.heart.three {

    top: 35%;

    right: 15%;

    font-size: 25px;

    animation-delay: 4s;
}

@keyframes floatHeart {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-15px);
    }
}


/* MAIN */

.wrapper {

    width: 100%;

    max-width: 650px;

    position: relative;

    z-index: 2;
}


/* BRAND */

.brand {

    text-align: center;

    margin-bottom: 25px;
}

.brand-name {

    font-size: 14px;

    letter-spacing: 5px;

    color: #d4af37;

    font-weight: bold;

    text-transform: uppercase;
}

.tagline {

    margin-top: 8px;

    color: #aaa;

    font-size: 13px;

    letter-spacing: 2px;
}


/* CARD */

.message-card {

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.07),
            rgba(255,255,255,.025)
        );

    border: 1px solid rgba(212,175,55,.35);

    border-radius: 25px;

    padding: 35px 28px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.65),

        inset 0 1px 0
        rgba(255,255,255,.08);

    backdrop-filter: blur(12px);

    text-align: center;
}


/* LOVE ICON */

.love-icon {

    width: 65px;

    height: 65px;

    margin: 0 auto 20px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        rgba(212,175,55,.12);

    border:
        1px solid rgba(212,175,55,.35);

    font-size: 28px;
}


/* PHOTO */

.photo-container {

    width: 100%;

    margin: 0 auto 28px;

    display: none;
}

.photo-container.show {

    display: block;
}

.photo-container img {

    display: block;

    width: 100%;

    max-width: 430px;

    max-height: 500px;

    object-fit: cover;

    margin: 0 auto;

    border-radius: 18px;

    border:
        1px solid
        rgba(212,175,55,.45);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.5);
}


/* MESSAGE */

.message-label {

    color: #d4af37;

    font-size: 11px;

    letter-spacing: 3px;

    text-transform: uppercase;

    margin-bottom: 10px;
}

.message-title {

    margin: 0 0 20px;

    font-size: 28px;

    line-height: 1.25;

    color: white;
}

.message-text {

    color: #e5e5e5;

    font-size: 16px;

    line-height: 1.9;

    white-space: pre-wrap;

    margin-bottom: 28px;
}


/* FROM / FOR */

.details {

    border-top:
        1px solid
        rgba(255,255,255,.1);

    padding-top: 22px;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 15px;
}

.detail-box {

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 12px;

    padding: 14px;
}

.detail-label {

    display: block;

    color: #999;

    font-size: 11px;

    letter-spacing: 2px;

    text-transform: uppercase;

    margin-bottom: 6px;
}

.detail-value {

    color: #d4af37;

    font-weight: bold;

    font-size: 14px;
}


/* FOOTER */

.footer {

    margin-top: 28px;

    color: #888;

    font-size: 13px;

    line-height: 1.6;
}


/* EXPLORE BUTTON */

.explore-button {

    display: inline-block;

    margin-top: 18px;

    padding: 15px 24px;

    border-radius: 30px;

    background:
        linear-gradient(
            135deg,
            #d4af37,
            #f0d56a
        );

    color: #080808;

    text-decoration: none;

    font-weight: bold;

    font-size: 14px;

    box-shadow:
        0 10px 30px
        rgba(212,175,55,.2);

    transition: .25s;
}

.explore-button:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 15px 35px
        rgba(212,175,55,.3);
}


/* LOADING */

.loading {

    text-align: center;

    color: #aaa;

    padding: 30px;
}


/* ERROR */

.error {

    text-align: center;

    color: #ffaaaa;

    line-height: 1.7;

    padding: 20px;
}


/* MOBILE */

@media(max-width:600px) {

    body {

        padding: 15px;
    }

    .message-card {

        padding:
            30px 20px;
    }

    .message-title {

        font-size: 24px;
    }

    .message-text {

        font-size: 15px;

        line-height: 1.8;
    }

    .details {

        grid-template-columns:
            1fr;
    }

    .photo-container img {

        max-height: 400px;
    }
}

</style>

</head>

<body>


<div class="heart one">♡</div>

<div class="heart two">♡</div>

<div class="heart three">♡</div>


<div class="wrapper">


    <!-- BRAND -->

    <div class="brand">

        <div class="brand-name">
            KimasFootwear
        </div>

        <div class="tagline">
            WALK WITH MEANING
        </div>

    </div>


    <!-- MESSAGE CARD -->

    <div class="message-card">

        <div class="love-icon">
            ♡
        </div>


        <div
            id="loading"
            class="loading"
        >
            Opening your special message...
        </div>


        <div
            id="messageContent"
            class="hidden"
        >


            <!-- PHOTO -->

            <div
                id="photoContainer"
                class="photo-container"
            >

                <img
                    id="messagePhoto"
                    src=""
                    alt="Personal photo"
                >

            </div>


            <!-- TITLE -->

            <div class="message-label">
                A Special Message For You
            </div>

            <h1
                id="messageTitle"
                class="message-title"
            >
                A Special Message
            </h1>


            <!-- MESSAGE -->

            <div
                id="messageText"
                class="message-text"
            ></div>


            <!-- DETAILS -->

            <div class="details">

                <div class="detail-box">

                    <span class="detail-label">
                        From
                    </span>

                    <span
                        id="messageSender"
                        class="detail-value"
                    >
                        -
                    </span>

                </div>


                <div class="detail-box">

                    <span class="detail-label">
                        For
                    </span>

                    <span
                        id="messageRecipient"
                        class="detail-value"
                    >
                        -
                    </span>

                </div>

            </div>


            <!-- FOOTER -->

            <div class="footer">

                A special message from
                <strong>KimasFootwear</strong>.

                <br>

                Every step can carry a
                beautiful meaning.

                <br>


                <a
                    href="index.html"
                    class="explore-button"
                >
                    ✦ Explore KimasFootwear Collections
                </a>

            </div>


        </div>


        <!-- ERROR -->

        <div
            id="error"
            class="error hidden"
        ></div>

    </div>


</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://hisdjtixefaoocvlzaml.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_7xeB9QdYgjXpZ1pHRvtI9w_Wzbe1SIh";


let supabaseClient = null;


/* =====================================================
   INITIALIZE
===================================================== */

function initializeSupabase() {

    if (!window.supabase) {

        showError(
            "Unable to load the message system. Please refresh the page."
        );

        return false;
    }


    try {

        supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );

        return true;

    } catch(error) {

        console.log(error);

        showError(
            "Unable to connect to KimasFootwear."
        );

        return false;
    }
}


/* =====================================================
   GET CODE
===================================================== */

function getMessageCode() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    return params.get("code");
}


/* =====================================================
   LOAD MESSAGE
===================================================== */

async function loadMessage() {

    const code =
        getMessageCode();


    if (!code) {

        showError(
            "This message link is incomplete.<br><br>" +
            "Please use the QR code or customer link provided by KimasFootwear."
        );

        return;
    }


    if (!initializeSupabase()) {

        return;
    }


    try {

        const {
            data,
            error
        } =
        await supabaseClient

        .from("messages")

        .select(
            "title,message,sender,recipient,active,photo_url"
        )

        .eq(
            "code",
            code
        )

        .eq(
            "active",
            true
        )

        .maybeSingle();


        if (error) {

            console.log(error);

            showError(
                "We couldn't open this message right now.<br><br>" +
                "Please try again."
            );

            return;
        }


        if (!data) {

            showError(
                "This message could not be found.<br><br>" +
                "Please check that your QR code or link is correct."
            );

            return;
        }


        /* TITLE */

        document
        .getElementById(
            "messageTitle"
        )
        .textContent =
            data.title ||
            "A Special Message For You";


        /* MESSAGE */

        document
        .getElementById(
            "messageText"
        )
        .textContent =
            data.message || "";


        /* SENDER */

        document
        .getElementById(
            "messageSender"
        )
        .textContent =
            data.sender ||
            "-";


        /* RECIPIENT */

        document
        .getElementById(
            "messageRecipient"
        )
        .textContent =
            data.recipient ||
            "-";


        /* =================================================
           PHOTO
        ================================================= */

        const photoContainer =
            document.getElementById(
                "photoContainer"
            );

        const photo =
            document.getElementById(
                "messagePhoto"
            );


        if (
            data.photo_url &&
            data.photo_url.trim() !== ""
        ) {

            photo.src =
                data.photo_url;


            photo.onload =
                function() {

                    photoContainer
                        .classList
                        .add("show");
                };


            photo.onerror =
                function() {

                    console.log(
                        "Could not load message photo."
                    );

                    photoContainer
                        .classList
                        .remove("show");
                };


        } else {

            photoContainer
                .classList
                .remove("show");
        }


        /* SHOW MESSAGE */

        document
        .getElementById(
            "loading"
        )
        .classList
        .add("hidden");


        document
        .getElementById(
            "messageContent"
        )
        .classList
        .remove("hidden");


    } catch(error) {

        console.log(error);

        showError(
            "Something went wrong while opening your message.<br><br>" +
            "Please try again."
        );
    }
}


/* =====================================================
   ERROR
===================================================== */

function showError(message) {

    document
    .getElementById(
        "loading"
    )
    .classList
    .add("hidden");


    const error =
        document.getElementById(
            "error"
        );


    error.innerHTML =
        message;


    error.classList
        .remove("hidden");
}


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadMessage();

    }
);

</script>

</body>
</html>
