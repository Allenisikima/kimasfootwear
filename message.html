<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>KimasFootwear | A Special Message</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   GLOBAL
===================================================== */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    color: white;

    background:

        radial-gradient(
            circle at 20% 15%,
            rgba(212,175,55,0.16),
            transparent 30%
        ),

        radial-gradient(
            circle at 85% 20%,
            rgba(255,105,180,0.12),
            transparent 28%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(212,175,55,0.10),
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #050505,
            #160b12,
            #080808,
            #140c0d
        );

    overflow-x: hidden;

}


/* =====================================================
   DECORATIVE BACKGROUND
===================================================== */

body::before {

    content: "♡";

    position: fixed;

    top: 8%;

    left: 8%;

    font-size: 100px;

    color:
        rgba(212,175,55,0.05);

    transform: rotate(-15deg);

    pointer-events: none;

}


body::after {

    content: "♡";

    position: fixed;

    bottom: 5%;

    right: 8%;

    font-size: 140px;

    color:
        rgba(255,105,180,0.04);

    transform: rotate(15deg);

    pointer-events: none;

}


/* =====================================================
   MAIN
===================================================== */

.page {

    width: 100%;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 35px 18px;

}


.container {

    width: 100%;

    max-width: 720px;

}


/* =====================================================
   BRAND
===================================================== */

.brand {

    text-align: center;

    margin-bottom: 28px;

}


.brand-name {

    color: #d4af37;

    font-size: 32px;

    font-weight: bold;

    letter-spacing: 4px;

    text-transform: uppercase;

    text-shadow:
        0 0 20px
        rgba(212,175,55,0.25);

}


.brand-tagline {

    margin-top: 8px;

    color: #c9c9c9;

    font-size: 13px;

    letter-spacing: 3px;

    text-transform: uppercase;

}


.gold-line {

    width: 75px;

    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #d4af37,
            transparent
        );

    margin:
        18px auto 0;

}


/* =====================================================
   MESSAGE CARD
===================================================== */

.card {

    position: relative;

    background:

        linear-gradient(
            145deg,
            rgba(35,35,35,0.96),
            rgba(12,12,12,0.98)
        );

    border:

        1px solid
        rgba(212,175,55,0.35);

    border-radius: 28px;

    padding: 45px 38px;

    text-align: center;

    box-shadow:

        0 25px 80px
        rgba(0,0,0,0.65),

        0 0 50px
        rgba(212,175,55,0.06);

    overflow: hidden;

}


/* GOLD CORNERS */

.card::before {

    content: "";

    position: absolute;

    width: 120px;

    height: 120px;

    top: -65px;

    right: -65px;

    border-radius: 50%;

    background:
        rgba(212,175,55,0.10);

}


.card::after {

    content: "";

    position: absolute;

    width: 100px;

    height: 100px;

    bottom: -55px;

    left: -55px;

    border-radius: 50%;

    background:
        rgba(255,105,180,0.08);

}


/* =====================================================
   LOVE ICON
===================================================== */

.heart {

    width: 65px;

    height: 65px;

    margin:
        0 auto 25px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 30px;

    color: #d4af37;

    background:
        radial-gradient(
            circle,
            rgba(212,175,55,0.20),
            rgba(212,175,55,0.03)
        );

    border:
        1px solid
        rgba(212,175,55,0.35);

    box-shadow:
        0 0 30px
        rgba(212,175,55,0.12);

}


/* =====================================================
   INTRO
===================================================== */

.intro {

    color: #aaa;

    font-size: 13px;

    letter-spacing: 2px;

    text-transform: uppercase;

    margin-bottom: 14px;

}


/* =====================================================
   MESSAGE TITLE
===================================================== */

.message-title {

    margin: 0 0 25px;

    color: #d4af37;

    font-size: 34px;

    line-height: 1.25;

    font-weight: normal;

    text-shadow:
        0 0 20px
        rgba(212,175,55,0.15);

}


/* =====================================================
   MESSAGE
===================================================== */

.message-text {

    color: #f3f3f3;

    font-size: 19px;

    line-height: 1.9;

    white-space: pre-wrap;

    max-width: 570px;

    margin:
        0 auto;

}


/* =====================================================
   DETAILS
===================================================== */

.details {

    margin-top: 35px;

    padding-top: 24px;

    border-top:
        1px solid
        rgba(255,255,255,0.10);

}


.detail {

    margin: 9px 0;

    color: #999;

    font-size: 14px;

}


.detail strong {

    color: #d4af37;

    font-weight: normal;

    margin-right: 5px;

}


/* =====================================================
   COLLECTION BUTTON
===================================================== */

.explore-section {

    margin-top: 38px;

}


.explore-text {

    color: #888;

    font-size: 13px;

    margin-bottom: 15px;

}


.explore-button {

    display: inline-block;

    text-decoration: none;

    padding: 15px 28px;

    border-radius: 50px;

    background:
        linear-gradient(
            135deg,
            #d4af37,
            #f3d875,
            #b89120
        );

    color: #080808;

    font-family: Arial, sans-serif;

    font-size: 14px;

    font-weight: bold;

    letter-spacing: 1px;

    box-shadow:

        0 10px 30px
        rgba(212,175,55,0.18);

    transition:
        transform .25s ease,
        box-shadow .25s ease;

}


.explore-button:hover {

    transform:
        translateY(-3px);

    box-shadow:

        0 15px 35px
        rgba(212,175,55,0.30);

}


/* =====================================================
   FOOTER
===================================================== */

.footer {

    text-align: center;

    margin-top: 28px;

    color: #666;

    font-size: 12px;

    letter-spacing: 1px;

}


.footer span {

    color: #d4af37;

}


/* =====================================================
   LOADING
===================================================== */

.loading {

    text-align: center;

    padding: 35px 10px;

    color: #aaa;

    font-family: Arial, sans-serif;

}


.loading-heart {

    font-size: 32px;

    color: #d4af37;

    margin-bottom: 15px;

    animation:
        pulse 1.5s infinite;

}


@keyframes pulse {

    0% {
        transform: scale(1);
        opacity: .6;
    }

    50% {
        transform: scale(1.15);
        opacity: 1;
    }

    100% {
        transform: scale(1);
        opacity: .6;
    }

}


/* =====================================================
   ERROR
===================================================== */

.error {

    display: none;

    text-align: center;

}


.error h2 {

    color: #d4af37;

    font-size: 27px;

}


.error p {

    color: #aaa;

    line-height: 1.7;

    font-family: Arial, sans-serif;

}


.code {

    margin-top: 20px;

    padding: 12px;

    background: #191919;

    border-radius: 8px;

    color: #777;

    font-family: monospace;

    font-size: 12px;

    word-break: break-all;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .page {

        padding:
            25px 13px;

    }


    .brand-name {

        font-size: 25px;

        letter-spacing: 3px;

    }


    .brand-tagline {

        font-size: 10px;

        letter-spacing: 2px;

    }


    .card {

        padding:
            35px 20px;

        border-radius: 22px;

    }


    .message-title {

        font-size: 27px;

    }


    .message-text {

        font-size: 17px;

        line-height: 1.8;

    }


    .explore-button {

        width: 100%;

        padding:
            15px 20px;

    }

}

</style>

</head>


<body>


<div class="page">

<div class="container">


<!-- =================================================
     BRAND
================================================== -->

<div class="brand">

    <div class="brand-name">
        KimasFootwear
    </div>

    <div class="brand-tagline">
        Walk With Meaning
    </div>

    <div class="gold-line"></div>

</div>


<!-- =================================================
     MESSAGE CARD
================================================== -->

<div class="card">


    <!-- LOADING -->

    <div id="loading"
         class="loading">

        <div class="loading-heart">
            ♡
        </div>

        <div>
            Opening something special...
        </div>

    </div>


    <!-- MESSAGE -->

    <div id="messageContent"
         style="display:none;">


        <div class="heart">
            ♡
        </div>


        <div class="intro">
            A message made just for you
        </div>


        <h1
            id="messageTitle"
            class="message-title">
        </h1>


        <div
            id="messageText"
            class="message-text">
        </div>


        <!-- DETAILS -->

        <div
            id="details"
            class="details">


            <div
                id="senderRow"
                class="detail">

                <strong>From:</strong>

                <span
                    id="sender">
                </span>

            </div>


            <div
                id="recipientRow"
                class="detail">

                <strong>For:</strong>

                <span
                    id="recipient">
                </span>

            </div>


        </div>


        <!-- EXPLORE -->

        <div class="explore-section">

            <div class="explore-text">

                Loved the experience?

                Discover more from KimasFootwear.

            </div>


            <a
                href="index.html"
                class="explore-button">

                ✦ Explore KimasFootwear Collections

            </a>

        </div>


    </div>


    <!-- ERROR -->

    <div
        id="error"
        class="error">

        <div class="heart">
            ♡
        </div>

        <h2>
            Message Not Found
        </h2>

        <p id="errorText">
            We couldn't find this message.
        </p>

        <div
            id="errorCode"
            class="code">
        </div>

    </div>


</div>


<!-- FOOTER -->

<div class="footer">

    Every step tells a story.

    <br>

    <span>
        KimasFootwear
    </span>

</div>


</div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://hisdjtixefaoocvlzaml.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_7xeB9QdYgjXpZ1pHRvtI9w_Wzbe1SIh";


let supabaseClient;


/* =====================================================
   INITIALIZE
===================================================== */

function initializeSupabase() {

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

}


/* =====================================================
   GET CODE
===================================================== */

function getMessageCode() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("code");

}


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(
    message,
    code
) {

    document
        .getElementById("loading")
        .style.display = "none";


    document
        .getElementById("messageContent")
        .style.display = "none";


    document
        .getElementById("error")
        .style.display = "block";


    document
        .getElementById("errorText")
        .textContent =
            message;


    if (code) {

        document
            .getElementById("errorCode")
            .textContent =
                "Code: " + code;

    }

}


/* =====================================================
   LOAD MESSAGE
===================================================== */

async function loadMessage() {

    const code =
        getMessageCode();


    /* NO CODE */

    if (!code) {

        showError(
            "No message code was provided. Please use the link or QR code given to you.",
            ""
        );

        return;

    }


    try {

        initializeSupabase();


        const {
            data,
            error
        } =
        await supabaseClient
            .from("messages")
            .select(
                "title,message,sender,recipient,active"
            )
            .eq(
                "code",
                code
            )
            .eq(
                "active",
                true
            )
            .maybeSingle();


        if (error) {

            console.error(error);

            showError(
                "We couldn't connect to the message service. Please try again.",
                code
            );

            return;

        }


        if (!data) {

            showError(
                "This message does not exist, has been removed, or is no longer active.",
                code
            );

            return;

        }


        /* =============================================
           DISPLAY
        ============================================= */

        document
            .getElementById("loading")
            .style.display = "none";


        document
            .getElementById("messageContent")
            .style.display = "block";


        document
            .getElementById("messageTitle")
            .textContent =
                data.title ||
                "A Special Message";


        document
            .getElementById("messageText")
            .textContent =
                data.message ||
                "";


        /* SENDER */

        if (data.sender) {

            document
                .getElementById("sender")
                .textContent =
                    data.sender;

        }

        else {

            document
                .getElementById("senderRow")
                .style.display =
                    "none";

        }


        /* RECIPIENT */

        if (data.recipient) {

            document
                .getElementById("recipient")
                .textContent =
                    data.recipient;

        }

        else {

            document
                .getElementById("recipientRow")
                .style.display =
                    "none";

        }


        /* PAGE TITLE */

        document.title =
            "KimasFootwear | " +
            (
                data.title ||
                "A Special Message"
            );


    }

    catch(error) {

        console.error(error);

        showError(
            "Something went wrong while opening your message. Please try again.",
            code
        );

    }

}


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadMessage();

    }
);

</script>


</body>

</html>
