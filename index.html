<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KimasFootwear | A Message For You</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #171717, #3a3028);
            color: #222;
            min-height: 100vh;
        }

        .container {
            width: 92%;
            max-width: 450px;
            margin: 0 auto;
            padding: 50px 0 30px;
            text-align: center;
        }

        .brand img {
    width: 220px;
    max-width: 80%;
    height: auto;
    display: block;
    margin: 0 auto;
}

        .tagline {
            color: #d6b98c;
            font-size: 14px;
            margin-top: 8px;
            letter-spacing: 2px;
        }

        .card {
            background: #ffffff;
            padding: 35px 22px;
            margin-top: 35px;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.35);
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #f4eadb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
        }

        h1 {
            font-size: 25px;
            margin: 0;
            color: #222;
        }

        .description {
            color: #777;
            line-height: 1.6;
            font-size: 15px;
            margin-top: 12px;
        }

        .label {
            display: block;
            text-align: left;
            margin-top: 25px;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #555;
        }

        input {
            width: 100%;
            padding: 17px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #b89563;
        }

        button {
            width: 100%;
            padding: 17px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            background: #222;
            color: white;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        #message {
    display: none;
    margin-top: 25px;
    padding: 22px;
    border-radius: 15px;
    background: #f8f1e7;
    border-left: 4px solid #b89563;
    font-size: 18px;
    font-weight: bold;
    line-height: 1.6;
    color: #333;
    animation: messageReveal 0.8s ease;
}

@keyframes messageReveal {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
            margin-top: 25px;
            padding: 22px;
            border-radius: 15px;
            background: #f8f1e7;
            border-left: 4px solid #b89563;
            font-size: 18px;
            font-weight: bold;
            line-height: 1.6;
            color: #333;
        }

        .footer {
            margin-top: 25px;
            color: #c9c9c9;
            font-size: 12px;
            line-height: 1.6;
        }

        .footer strong {
            color: #d6b98c;
        }

    </style>

</head>

<body>

    <div class="container">

        
<div class="brand">
    <img src="logo.png" alt="KimasFootwear Logo">
</div>
        
        

        <div class="card">

            <div class="icon">
                💌
            </div>

            <h1>A Message For You</h1>

<p class="description">
    Someone special chose this pair for you.
    A personal message is waiting inside.
</p>
            <label class="label">
                YOUR SECRET CODE
            </label>

            <input
                type="text"
                id="code"
                placeholder="e.g. KIMAS001"
            >

            <button onclick="revealMessage()">
                REVEAL MY MESSAGE
            </button>

            <div id="message"></div>

        </div>

        <div class="footer">
    Every step tells a story.<br>
    <strong>KimasFootwear</strong>
    <br><br>
    © 2026 KimasFootwear
</div>

    </div>


    <script>

        function revealMessage() {

            var code = document
                .getElementById("code")
                .value
                .trim()
                .toUpperCase();

            var message = document.getElementById("message");

            message.style.display = "block";

            if (code === "KIMAS001") {
                message.innerHTML = "You are deeply loved. ❤️";
            }

            else if (code === "KIMAS002") {
                message.innerHTML =
                    "Every step you take is a reminder of how special you are.";
            }

            else if (code === "KIMAS003") {
                message.innerHTML =
                    "This pair was made especially for you. Walk confidently!";
            }

            else if (code === "KIMAS004") {
                message.innerHTML =
                    "Someone believes in you more than you know. ❤️";
            }

            else if (code === "KIMAS005") {
                message.innerHTML =
                    "You deserve beautiful things and beautiful moments. 💎";
            }

            else if (code === "KIMAS006") {
                message.innerHTML =
                    "May every step you take lead you closer to your dreams. 👣";
            }

            else if (code === "KIMAS007") {
                message.innerHTML =
                    "You are appreciated more than words can say. ❤️";
            }

            else if (code === "KIMAS008") {
                message.innerHTML =
                    "This is more than footwear. It carries a message made just for you. 💌";
            }

            else if (code === "KIMAS009") {
                message.innerHTML =
                    "Keep walking. Your best chapters are still ahead. ✨";
            }

            else if (code === "KIMAS010") {
                message.innerHTML =
                    "Every step tells a story. Make yours a beautiful one. 👣❤️";
            }

            else {
                message.innerHTML =
                    "Sorry, this code is not valid. Please check your code and try again.";
            }

        }

    </script>

</body>

</html>
