<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KimasFootwear | Every Step Tells a Story</title>

  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #f8f5f0;
      color: #171717;
      line-height: 1.6;
    }

    /* HEADER */

    header {
      background: #111;
      color: white;
      padding: 15px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .brand img {
      width: 45px;
      height: 45px;
      object-fit: contain;
      background: white;
      border-radius: 50%;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
      font-size: 13px;
      font-family: 'Montserrat', sans-serif;
    }

    /* HERO */

    .hero {
      min-height: 75vh;
      padding: 60px 7%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;

      background:
        linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,.75)),
        url("logo.png") center/contain no-repeat;

      background-color: #222;
    }

    .hero-content {
      max-width: 700px;
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 52px;
      line-height: 1.1;
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    .gold {
      color: #d6a85f;
    }

    .hero p {
      font-family: 'Montserrat', sans-serif;
      font-size: 18px;
      margin-bottom: 25px;
    }

    /* BUTTONS */

    .button {
      display: inline-block;
      padding: 13px 25px;
      margin: 5px;
      border-radius: 30px;

      background: #d6a85f;
      color: #111;

      text-decoration: none;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;

      transition: .3s;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .outline {
      background: transparent;
      border: 1px solid white;
      color: white;
    }

    /* GENERAL SECTIONS */

    section {
      padding: 65px 7%;
    }

    .title {
      text-align: center;
      margin-bottom: 35px;
    }

    .title h2 {
      font-family: 'Playfair Display', serif;
      font-size: 34px;
      margin-bottom: 8px;
    }

    .title p {
      font-family: 'Montserrat', sans-serif;
      color: #666;
    }

    /* MESSAGE */

    .message {
      background: #111;
      color: white;
      text-align: center;
    }

    .message h2 {
      color: #d6a85f;
      font-family: 'Playfair Display', serif;
      font-size: 35px;
      margin-bottom: 15px;
    }

    .message p {
      max-width: 650px;
      margin: auto;
      color: #ddd;
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
    }

    /* COLLECTION */

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 30px 20px;
      text-align: center;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);

      transition: .3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 23px;
      margin-bottom: 8px;
    }

    .card p {
      color: #666;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
    }

    /* SECRET MESSAGE */

    .secret-message {
      background: #f8f5f0;
      text-align: center;
    }

    .message-box {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 40px 30px;
      border-radius: 24px;

      box-shadow: 0 15px 45px rgba(0,0,0,.10);
    }

    .message-box input {
      width: 100%;
      padding: 17px;

      border: 1px solid #ddd;
      border-radius: 12px;

      font-family: 'Montserrat', sans-serif;
      font-size: 15px;

      text-align: center;

      margin-bottom: 15px;

      outline: none;
    }

    .message-box input:focus {
      border-color: #d6a85f;
      box-shadow: 0 0 0 3px rgba(214,168,95,.15);
    }

    .message-box button {
      width: 100%;
      padding: 16px;

      border: none;
      border-radius: 30px;

      background: #111;
      color: white;

      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

      transition: .3s;
    }

    .message-box button:hover {
      background: #d6a85f;
      color: #111;
    }

    /* REVEALED LETTER */

    #revealedMessage {
      display: none;

      margin-top: 30px;
      padding: 45px 30px;

      background:
        linear-gradient(145deg, #fffdf8, #f7efe2);

      border-radius: 24px;

      border: 1px solid #e3c98f;

      box-shadow:
        0 15px 45px rgba(0, 0, 0, .12);

      text-align: left;

      position: relative;
      overflow: hidden;

      animation: letterReveal .9s ease;
    }

    #revealedMessage::before {
      content: "";

      position: absolute;

      top: 0;
      left: 12%;
      right: 12%;

      height: 3px;

      background: #d6a85f;

      border-radius: 10px;
    }

    /* BEAUTIFUL LETTER HEADING */

    #revealedMessage h3 {
      margin-bottom: 25px;

      color: #171717;

      font-family: 'Allura', cursive;

      font-size: 48px;

      text-align: center;

      font-weight: normal;
    }

    /* BEAUTIFUL LETTER TEXT */

    #revealedMessage p {
      color: #403a34;

      font-family: 'Cormorant Garamond', serif;

      font-size: 21px;

      line-height: 1.9;

      letter-spacing: .3px;
    }
