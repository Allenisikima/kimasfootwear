<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Message | KimasFootwear</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #111;
    color: white;
    font-family: 'Montserrat', sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px;
}

.message-page {
    width: 100%;
    max-width: 700px;
    text-align: center;
}

.logo {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
    color: #d4af37;

    margin-bottom: 50px;
}

.card {
    background: #1b1b1b;
    border: 1px solid #333;

    padding: 50px 35px;

    border-radius: 8px;

    box-shadow: 0 15px 50px rgba(0,0,0,0.4);
}

.small-title {
    color: #d4af37;

    font-size: 14px;

    letter-spacing: 3px;

    text-transform: uppercase;

    margin-bottom: 20px;
}

h1 {
    font-family: 'Playfair Display', serif;

    color: #d4af37;

    font-size: 45px;

    margin-bottom: 25px;
}

.sender {
    color: #aaa;

    font-size: 15px;

    margin-bottom: 30px;
}

.message {
    font-family: 'Cormorant Garamond', serif;

    font-size: 27px;

    line-height: 1.7;

    color: #f5f5f5;

    white-space: pre-wrap;
}

.gold-button {
    display: inline-block;

    margin-top: 35px;

    background: #d4af37;

    color: #111;

    padding: 14px 30px;

    border-radius: 5px;

    text-decoration: none;

    font-weight: 700;

    transition: 0.3s;
}

.gold-button:hover {
    background: white;
}

@media (max-width: 600px) {

    body {
        padding: 20px;
    }

    .card {
        padding: 40px 22px;
    }

    h1 {
        font-size: 35px;
    }

    .message {
        font-size: 23px;
    }

}

</style>

</head>

<body>

<div class="message-page">

    <div class="logo">
        KimasFootwear
    </div>

    <div class="card">

        <div class="small-title">
            A Message For You
        </div>

        <h1 id="title">
            Loading...
        </h1>

        <div class="sender" id="sender"></div>

        <div class="message" id="message">
            Please wait...
        </div>

        <a href="index.html" class="gold-button">
            Visit KimasFootwear
        </a>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://hisdjtixefaoocvlzaml.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_7xeB9QdYgjXpZ1pHRvtI9w_Wzbe1SIh";


const params =
    new URLSearchParams(window.location.search);

const code =
    params.get("code");


async function loadMessage() {

    const title =
        document.getElementById("title");

    const sender =
        document.getElementById("sender");

    const message =
        document.getElementById("message");


    /* NO CODE */

    if (!code) {

        title.textContent =
            "Message Not Found";

        sender.textContent = "";

        message.textContent =
            "This link does not contain a valid KimasFootwear message code.";

        return;
    }


    try {

        const response = await fetch(

            `${SUPABASE_URL}/rest/v1/messages?code=eq.${encodeURIComponent(code)}&active=eq.true&select=title,message,sender,recipient`,

            {
                method: "GET",

                headers: {

                    "apikey": SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${SUPABASE_KEY}`,

                    "Content-Type":
                        "application/json"

                }

            }

        );


        if (!response.ok) {

            throw new Error(
                "Unable to connect to message service."
            );

        }


        const data =
            await response.json();


        /* CODE NOT FOUND */

        if (!data || data.length === 0) {

            title.textContent =
                "Message Not Found";

            sender.textContent = "";

            message.textContent =
                "This message may have expired, been deactivated, or the code may be incorrect.";

            return;

        }


        /* MESSAGE FOUND */

        const msg =
            data[0];


        title.textContent =
            msg.title || "A Special Message";


        message.textContent =
            msg.message || "";


        if (msg.sender) {

            sender.textContent =
                `From ${msg.sender}`;

        } else {

            sender.textContent = "";

        }

    }


    catch (error) {

        console.error(error);


        title.textContent =
            "Something Went Wrong";


        sender.textContent = "";


        message.textContent =
            "We couldn't load this message right now. Please try again.";

    }

}


loadMessage();

</script>

</body>
</html>
